apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
  labels:
    app: lms-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
      - name: lms-portal
        image:  nandana200621/lms-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Readiness Probe ensures bad versions fail the rollout health check
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
